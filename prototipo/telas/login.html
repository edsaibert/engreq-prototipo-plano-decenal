<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compromissos Decenais | Login</title>
  <link rel="stylesheet" href="main.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="hero-banner" data-bg-color="primary-blue">
      <div class="page-section grid grid-cols-2" style="align-items:center;">
        <div class="stack">
          <div class="cluster">
            <div class="logo-wrapper">
              <img src="logo.png" alt="Logo do Sistema Compromissos Decenais" width="88" height="88">
            </div>
            <span class="section-kicker">Protótipo</span>
          </div>
          <h1 class="brand-header">Compromissos Decenais da Criança e do Adolescente</h1>
          <p class="brand-body-text">Acompanhe o Plano Decenal com uma identidade visual institucional, clara e voltada para o monitoramento de informações públicas.</p>
        </div>

        <div class="card surface-elevated">
          <div class="card-header">
            <div>
              <h2 class="card-title">Entrar no sistema</h2>
              <p class="card-meta">Acesso por e-mail e senha durante o protótipo.</p>
            </div>
          </div>

          <form class="stack" action="hierarquia.html" method="get">
            <label class="form-field">
              <span class="form-label">E-mail</span>
              <input type="email" name="email" placeholder="nome@exemplo.com" required>
            </label>

            <label class="form-field">
              <span class="form-label">Senha</span>
              <input type="password" name="senha" placeholder="Digite sua senha" required>
            </label>

            <div class="cluster" style="justify-content:space-between;">
              <label class="cluster" style="gap:.5rem;">
                <input type="checkbox" name="lembrar" style="width:auto;">
                <span class="text-muted">Lembrar acesso</span>
              </label>
              <button class="btn btn-secondary" type="submit">Entrar</button>
            </div>
          </form>

          <div class="divider"></div>

        </div>
      </div>
    </section>
  </main>
</body>
</html>
